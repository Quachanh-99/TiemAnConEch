<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tiệm Ăn Con Ếch</title>
 <style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f2f4f7;
  color: #222;
}

header {
  background: #1f7ae0;
  color: white;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 {
  margin: 0;
  font-size: 20px;
}

.small { font-size: 13px; opacity: 0.85 }

.container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
}


.panel {
  background: white;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.products { flex: 2 }
.cart { flex: 1; min-width: 280px }

h3 {
  margin-top: 0;
  font-size: 18px;
}

input, select {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
  width: 100%;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  background: #1f7ae0;
  color: white;
}

button:active {
  transform: scale(0.97);
}

button.secondary {
  background: #aaa;
}

.product {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  border-bottom: 1px solid #eee;
}

.product-name {
  font-size: 16px;
  font-weight: 600;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.cart-item button {
  padding: 6px 10px;
  font-size: 14px;
}

.badge {
  background: #ff9800;
  color: white;
  padding: 3px 8px;
  border-radius: 10px;
  font-size: 12px;
}

.hidden { display: none }

.top-actions input {
  width: 140px;
}
.tables {
  position: relative;
  width: 100%;
  min-height: 380px;
  background: #f9fafb;
  border-radius: 12px;
  border: 2px dashed #ddd;
}

.table {
  position: absolute;
  width: 70px;
  height: 50px;
  border: 2px solid #333;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: #fff;
}

.table.empty { background: #e5e7eb; }
.table.busy { background: #facc15; }  /* vàng */
.table.staff { background: #9ca3af; color: white; }
.table.active { outline: 3px solid #2563eb; }

@media (max-width: 430px){
  header{
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }

  .container{
    padding: 6px;
  }

  .tables{
    height: 460px;
  }

  .table{
    width: 64px;
    height: 46px;
    font-size: 13px;
  }

  button{
    padding: 8px 12px;
    font-size: 14px;
  }

  .product-name{
    font-size: 15px;
  }

  .cart-item button{
    padding: 4px 8px;
    font-size: 13px;
  }
}

.qty-badge{
  font-weight: 900;
  font-size: 16px;
  color: #dc2626;   /* đỏ đậm */
}
.cart-total{
  margin-top: 10px;
  font-size: 16px;
}

.cart-total-price{
  font-size: 22px;
  font-weight: 900;
  color: #dc2626;
}

</style>
  <!-- Firebase CDN (compat mode for simpler single-file example) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>
    <div>
      <h2>Tiệm Ăn Con Ếch</h2>
      <div class="small">
  Cửa hàng: <span id="storeIdDisplay">demo-store</span> · Cơm & Cháo Ếch Singapore
</div>
    </div>

    <div class="top-actions">
      <div id="authArea" class="loginbox">
        <input id="email" placeholder="Email" />
        <input id="password" placeholder="Mật khẩu" type="password" />
        <button id="btnLogin">Đăng nhập</button>
        <button id="btnSignup">Tạo user</button>
      </div>

     <div id="userArea" class="hidden">
  <span id="userEmail"></span>
  <button id="btnHistory">📊 Lịch sử</button>
  <button id="btnLogout">Đăng xuất</button>
</div>


      <div id="status" class="small">Status: <span id="netStatus">—</span></div>
    </div>
  </header>

 <div class="container" id="tableScreen">

    <div class="panel">
     <h3>Bàn</h3>
     <div id="tablesGrid" class="tables"></div>
    </div>

   
      <hr />
      <div id="productAdmin">
        <h4>Quản lý sản phẩm</h4>
        <input id="pName" placeholder="Tên sản phẩm" />
        <input id="pPrice" placeholder="Giá (VNĐ)" type="number" />
        <button id="btnAddProduct">Thêm/Update</button>
  
      </div>
    </div>
  
    <div class="container hidden" id="historyView">
  <div class="panel">
    <h3>📊 Lịch sử bán hàng 7 ngày</h3>
    <div id="daysList"></div>
    <hr/>
    <div id="dayDetail"></div>
    <button id="btnBack">⬅ Quay lại POS</button>
  </div>
</div>

<div class="container hidden" id="takeawayScreen">
  <div class="panel">
    <h3>🥡 Đơn mang về</h3>

    <button id="btnAddTakeaway">➕ Thêm khách</button>

    <div id="takeawayList" style="margin-top:10px"></div>

    <button id="btnBackFromTakeaway" style="margin-top:10px">
      ⬅ Quay lại
    </button>
  </div>
</div>



     <div id="orderScreen" class="hidden">
     
    <div class="panel cart">
      <h3>Cart / Thanh toán</h3>
      <div id="tableNumberDisplay" style="
          font-weight:bold;
          font-size:18px;
          margin-bottom:6px;
       ">
          Bàn: --
      </div>


      <div id="cartList"></div>
      <div style="margin-top:10px">
        <div class="cart-total">
  	Tổng:
  	<span id="totalAmount" class="cart-total-price">0</span> VNĐ
	</div>
        <div style="margin-top:8px; display:flex; gap:8px; align-items:center">
          <select id="paymentMethod">
            <option value="cash">Tiền mặt</option>
            <option value="momo">Chuyển khoản</option>
          </select>
          <button onclick="changeTable()">Đổi bàn</button>
          <button id="btnPay">Thanh toán</button>
          <button id="btnClear">Xóa bill</button>
        </div>
      </div>
      <div class="panel products">
      <h3>Products <span id="prodCount" class="badge">0</span></h3>
      <div id="productsList">
        <!-- products loaded here -->
      </div>
      </div>
      <hr />
      <h4>Hóa đơn mới nhất</h4>
      <div id="lastOrder"></div>
      <div style="margin-top:8px">
        <button id="btnPrintInvoice" class="hidden">In hóa đơn</button>
      </div>
    </div>
  </div>

  <footer>
    <div>Made by Quốc Anh ❤️</div>
  </footer>

<script>
  // ====== GLOBAL STATE ======
  let currentTable = null;
 
  // ====== CẬP NHẬT firebaseConfig Ở ĐÂY ======
 // https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyC-AaAzc1qOsRjs1Pa3IrHKRtT4ID2incI",
  authDomain: "pos-quocanh.firebaseapp.com",
  projectId: "pos-quocanh",
  storageBucket: "pos-quocanh.appspot.com",
  messagingSenderId: "564307196330",
  appId: "1:564307196330:web:ac98a34f838b20300213d3"
};

  // =========================================

  // Init Firebase (compat mode)
 firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storeId = "demo-store"; // đơn giản: dùng 1 store id cố định
const ordersRef = db.collection('stores').doc(storeId).collection('orders');
const tablesRef = db.collection("stores").doc(storeId).collection("tables");
const takeawaysRef = db
  .collection("stores")
  .doc(storeId)
  .collection("takeaways");


  document.getElementById('storeIdDisplay').textContent = storeId;

  // enable offline persistence (indexedDB)
  db.enablePersistence({ synchronizeTabs: true }).catch(function(err) {
    console.warn("Persistence error:", err && err.code);
  });

  // UI elements
  const emailEl = document.getElementById('email');
  const passEl = document.getElementById('password');
  const btnLogin = document.getElementById('btnLogin');
  const btnSignup = document.getElementById('btnSignup');
  const authArea = document.getElementById('authArea');
  const userArea = document.getElementById('userArea');
  const userEmail = document.getElementById('userEmail');
  const btnLogout = document.getElementById('btnLogout');
  const netStatus = document.getElementById('netStatus');

  const productsList = document.getElementById('productsList');
  const prodCount = document.getElementById('prodCount');
  const pName = document.getElementById('pName');
  const pPrice = document.getElementById('pPrice');
  const btnAddProduct = document.getElementById('btnAddProduct');

  const cartList = document.getElementById('cartList');
  const totalAmountEl = document.getElementById('totalAmount');
  const btnPay = document.getElementById('btnPay');
  const btnClear = document.getElementById('btnClear');
  
 btnClear.onclick = async () => {
  if (!currentTable) return;

  // 👉 NẾU LÀ ĐƠN MANG VỀ
  if (currentTable.type === "takeaway") {
    if (!confirm("Xóa đơn mang về này?")) return;

    // Xóa đơn hiện tại
    await currentTable.ref.delete();

    // Lấy lại danh sách mang về
    const snap = await takeawaysRef.orderBy("index").get();

    let idx = 1;
    for (const doc of snap.docs) {
      await takeawaysRef.doc(doc.id).update({
        index: idx,
        name: "Mang về " + idx
      });
      idx++;
    }

    // Reset trạng thái
    currentTable = null;

    // Quay về màn hình mang về
    document.getElementById("orderScreen").classList.add("hidden");
    takeawayScreen.classList.remove("hidden");

    loadTakeaways();
    return;
  }

  // 👉 BÀN THƯỜNG (GIỮ NGUYÊN)
  await tablesRef.doc(String(currentTable.id)).set({
    cart: [],
    status: "empty",
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });

  alert("Đã xóa bill bàn " + currentTable.name);
};





  const paymentMethod = document.getElementById('paymentMethod');

  const lastOrderEl = document.getElementById('lastOrder');
  const btnPrintInvoice = document.getElementById('btnPrintInvoice');

  // Network status
  function updateOnlineStatus() {
    netStatus.textContent = navigator.onLine ? "online" : "offline";
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  updateOnlineStatus();

  // Authentication
  btnSignup.onclick = async () => {
    const email = emailEl.value.trim();
    const pass = passEl.value;
    if(!email || !pass) return alert('Nhập email và mật khẩu');
    try {
      await auth.createUserWithEmailAndPassword(email, pass);
      alert('Tạo user thành công. Đăng nhập ngay.');
    } catch(e) { alert('Signup error: ' + e.message) }
  };

  btnLogin.onclick = async () => {
    const email = emailEl.value.trim();
    const pass = passEl.value;
    if(!email || !pass) return alert('Nhập email và mật khẩu');
    try {
      await auth.signInWithEmailAndPassword(email, pass);
    } catch(e){ alert('Login error: '+e.message) }
  };

  btnLogout.onclick = async () => {
    await auth.signOut();
  };

  
auth.onAuthStateChanged(async (user) => {
  if (user) {
    authArea.classList.add('hidden');
    userArea.classList.remove('hidden');
    userEmail.textContent = user.email;

    const userRef = db.collection("users").doc(user.uid);
    const snap = await userRef.get();

    if (!snap.exists) {
      let role = "staff";
      if (user.email === "tiemanconech@admin.local") role = "owner";

      await userRef.set({
        email: user.email,
        role: role,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      window.currentUser = { email: user.email, role: role };
    } else {
      window.currentUser = snap.data();
      
    }
	console.log("USER ROLE:", window.currentUser.role);
    applyRoleUI();
	renderProducts();
  } else {
    authArea.classList.remove('hidden');
    userArea.classList.add('hidden');
    userEmail.textContent = '';
    window.currentUser = null;
  }
});


  // ========== PRODUCTS realtime ==========
  let products = []; // local cache
  const productsRef = db.collection('stores').doc(storeId).collection('products');

  productsRef.onSnapshot(snapshot => {
    products = [];
    snapshot.forEach(doc => {
      products.push({ id: doc.id, ...doc.data() });
    });
    renderProducts();
  }, err => {
    console.error('products listener error', err);
  });
  

  function renderProducts(){
    productsList.innerHTML = '';
    prodCount.textContent = products.length;
    if(products.length === 0) {
      productsList.innerHTML = '<div class="small">Chưa có sản phẩm. Thêm thử bên dưới.</div>';
      return;
    }
    products.forEach(p => {
  	const div = document.createElement('div');
  	div.className = 'product';

  	let deleteBtn = "";
  	if (window.currentUser && window.currentUser.role === "owner") {
        deleteBtn = `<button data-id="${p.id}" class="btnDelete" style="background:#ef4444">Xóa</button>`;
  	}

  	div.innerHTML = `
    	<div>
           <div class="product-name">${escapeHtml(p.name)}</div>
           <div class="small">Giá: ${formatMoney(p.price)} VNĐ</div>
        </div>
        <div style="display:flex; gap:6px">
           <button data-id="${p.id}" class="btnAdd">Thêm</button>
           ${deleteBtn}
        </div>
   `;
  productsList.appendChild(div);
});
    //nút thêm
    // attach handlers
    Array.from(document.getElementsByClassName('btnAdd')).forEach(b=>{
      b.onclick = () => {
        const id = b.getAttribute('data-id');
        const prod = products.find(x=>x.id===id);
        if(prod) addToCart(prod);
      };
    });
    // nút xóa
    Array.from(document.getElementsByClassName('btnDelete')).forEach(b=>{
  	b.onclick = async () => {
    	if(!currentUser || currentUser.role !== "owner"){
        return alert("Chỉ chủ quán mới được xóa sản phẩm");
        }

    	const id = b.getAttribute('data-id');
    	if(!confirm("Xóa sản phẩm này luôn nha?")) return;

    	try{
          await productsRef.doc(id).delete();
          alert("Đã xóa sản phẩm");
    	}catch(e){
          alert("Lỗi khi xóa: " + e.message);
        }
  	};
    });
  }

  // add product (quick demo)
  btnAddProduct.onclick = async () => {
    const name = pName.value.trim();
    const price = parseInt(pPrice.value||0);
    if(!currentUser || currentUser.role !== "owner"){
    return alert("Chỉ chủ quán mới được thêm sản phẩm");
    }
    if(!name || !price) return alert('Nhập tên và giá');
    try {
      // create doc id from name slug for demo
      const id = name.toLowerCase().replace(/\s+/g,'-');
      await productsRef.doc(id).set({ name, price });
      pName.value = ''; pPrice.value = '';
      alert('Đã thêm/ cập nhật sản phẩm');
    } catch(e) {
      alert('Error add product: ' + e.message);
    }
  };

  // ========== CART logic ==========
 
  function applyRoleUI(){
  	if(!window.currentUser) return;

  	const isOwner = window.currentUser.role === "owner";

  	// Khu quản lý sản phẩm
  	const productAdmin = document.getElementById("productAdmin");
  	if(productAdmin){
    	productAdmin.style.display = isOwner ? "block" : "none";
  	}

  	// Nút lịch sử
  	const btnHistory = document.getElementById("btnHistory");
  	if(btnHistory){
    	btnHistory.style.display = isOwner ? "inline-block" : "none";
  	}
  }

 
  async function addToCart(prod){
  if(!currentTable) return alert("Chọn bàn trước");

  let cart = [...(currentTable.cart || [])]; // clone để chắc chắn
  const idx = cart.findIndex(i => i.id === prod.id);

  if(idx >= 0){
    cart[idx].qty++;
  } else {
    cart.push({
      id: prod.id,
      name: prod.name,
      price: prod.price,
      qty: 1,
      note: ""
    });
  }

  // ✅ UPDATE LOCAL STATE TRƯỚC
  currentTable.cart = cart;

  // ✅ RENDER NGAY
  renderCart();

  // ✅ SAU ĐÓ MỚI LƯU FIRESTORE
  if (currentTable.type === "takeaway") {
    await currentTable.ref.set({
      cart,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } else {
    await tablesRef.doc(String(currentTable.id)).set({
      cart,
      status: "busy",
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  }
}


  // 🔥 QUAN TRỌNG: phân biệt bàn & mang về
  if (currentTable.type === "takeaway") {

  // 1️⃣ cập nhật state local
  currentTable.cart = cart;

  // 2️⃣ render ngay cho UI nhảy
  renderCart();

  // 3️⃣ lưu Firestore (để sync + lịch sử)
  await currentTable.ref.set({
    cart: cart,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });

  return; // ⛔ RẤT QUAN TRỌNG
}


       
 if (currentTable.type !== "takeaway") {
  await tablesRef.doc(String(currentTable.id)).set({
    cart: cart,
    status: "busy",
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });
}




async function changeQty(id, delta){
  if(!currentTable) return;

  let cart = currentTable.cart || [];
  const idx = cart.findIndex(i=>i.id===id);

  if(idx>=0){
    cart[idx].qty += delta;
    if(cart[idx].qty <= 0) cart.splice(idx,1);

    await tablesRef.doc(String(currentTable.id)).update({
  cart: cart,
  status: "busy",
  updatedAt: firebase.firestore.FieldValue.serverTimestamp()
}, { merge: true });
  }
}






function renderCart(){
  if(!currentTable) return;

  if(!currentTable.cart) currentTable.cart = [];
  document.getElementById("tableNumberDisplay").innerText =
    currentTable ? "Bàn: " + currentTable.name : "Chưa chọn bàn";

  if(!currentTable){
    cartList.innerHTML = '<div class="small">Chưa chọn bàn</div>';
    totalAmountEl.textContent = "0";
    return;
  }

  
  

  const cart = currentTable.cart || [];

  cartList.innerHTML = "";
  let total = 0;

  if(cart.length === 0){
    cartList.innerHTML = '<div class="small">Giỏ trống</div>';
    totalAmountEl.textContent = "0";
    return;
  }

  cart.forEach(i=>{
  const row = document.createElement("div");
  row.className = "cart-item";

  row.innerHTML = `
  <div style="flex:1">
    <b>${escapeHtml(i.name)}</b><br/>
    <span class="small">
       ${formatMoney(i.price)} 
       <span class="qty-badge">x${i.qty}</span>
    </span>


    <div style="margin-top:4px">
  <input
    id="note-${i.id}"
    type="text"
    placeholder="Ghi chú (VD: ÍT CAY, KHÔNG HÀNH...)"
    value="${escapeHtml(i.note || "")}"
    oninput="autoSaveNote('${i.id}', this.value)"
    style="font-weight:bold; width:100%;"
  />
</div>


  <div>
    <button onclick="changeQty('${i.id}',-1)">-</button>
    <button onclick="changeQty('${i.id}',1)">+</button>
  </div>
`;

  cartList.appendChild(row);
  total += i.price * i.qty;
});


  totalAmountEl.textContent = formatMoney(total);
}


  
   // ========== Orders: create + realtime last order ==========
  
  ordersRef
  .orderBy("createdAt", "desc")
  .limit(1)
  .onSnapshot(snap => {
    if(!snap.empty){
      const doc = snap.docs[0];
      renderLastOrder({
        id: doc.id,
        ...doc.data()
      });
    }
  });


  btnPay.onclick = async () => {
  if(!currentTable) return alert("Chưa chọn bàn");

  const cart = currentTable.cart || [];

  if(cart.length===0) return alert("Bàn trống");

  // Bàn nhân viên
  if(currentTable.type==="staff"){
    alert("Bàn nhân viên ăn – không tính doanh thu");
    
    return;
  }

  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const dateKey = new Date().toISOString().slice(0,10);

  await ordersRef.add({
  	tableId: currentTable.id,
  	tableName: currentTable.name,
  	items: cart,
 	total,
  	paymentMethod: paymentMethod.value,
  	createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  	createdBy: "Trương Đặng"   // người làm mặc định
 });
// 👉 Nếu là đơn mang về thì xóa sau khi thanh toán
if (currentTable.type === "takeaway") {
  await currentTable.ref.delete();
}

 


  const dailyRef = db.collection("stores").doc(storeId).collection("daily").doc(dateKey);
  await db.runTransaction(async(tx)=>{
    const snap = await tx.get(dailyRef);
    let data = { date: dateKey, totalRevenue: 0, products: {} };
    if(snap.exists) data = snap.data();

    data.totalRevenue += total;
    cart.forEach(i=>{
      if(!data.products[i.name]) data.products[i.name] = 0;
      data.products[i.name] += i.qty;
    });

    tx.set(dailyRef, data, {merge:true});
  });

  alert("Thanh toán xong cho " + currentTable.name);

  await tablesRef.doc(String(currentTable.id)).set({
  cart: [],
  status: "empty",
  updatedAt: firebase.firestore.FieldValue.serverTimestamp()
}, { merge: true });

// reset bàn hiện tại
currentTable = null;

// quay về màn hình chọn bàn
document.getElementById("orderScreen").classList.add("hidden");
document.getElementById("tableScreen").classList.remove("hidden");

// vẽ lại bàn ngay cho mượt
renderTables();

};


  function listenTables(){
  tablesRef.onSnapshot(snap => {
    snap.forEach(doc => {
      const data = doc.data();
      const t = tables.find(x => String(x.id) === doc.id);

      if(t){
 	 t.cart = data.cart || [];
 	 t.status = data.status || (t.cart.length > 0 ? "busy" : "empty");
      }

    });

    // vẽ lại bàn
    renderTables();

    // nếu đang chọn 1 bàn thì cập nhật cart của bàn đó
    if(currentTable){
      const match = tables.find(x => x.id === currentTable.id);
      if(match){
        currentTable = match;
        renderCart();
      }
    }
  });
}

  function renderLastOrder(order){

    lastOrderEl.innerHTML = `
      <div><b>ID:</b> ${order.id}</div>
      <div><b>Người làm:</b> ${order.createdByEmail||order.createdBy}</div>
      <div><b>Thời gian:</b> ${escapeHtml(time)}</div>
      <div><b>Tổng:</b> ${formatMoney(order.total)} VNĐ</div>
      <div style="margin-top:8px">
        <b>Items:</b>
        <ul>
          ${order.items.map(i=>`<li>${escapeHtml(i.name)} x${i.qty} — ${formatMoney(i.price)} each</li>`).join('')}
        </ul>
      </div>
    `;
    btnPrintInvoice.classList.remove('hidden');

  function printOrder(order){
    const html = `
      <html><head><title>Invoice ${order.id}</title>
        <style>body{font-family:Arial;} h3{margin-bottom:0}</style>
      </head><body>
        <h3>Hóa đơn - ${escapeHtml(order.id)}</h3>
	<div><b>Bàn:</b> ${escapeHtml(order.tableName || order.tableId)}</div>
	<div><b>Người làm:</b> ${escapeHtml(order.createdBy)}</div>
	<div><b>Thời gian:</b> ${order.createdAt && order.createdAt.toDate ? order.createdAt.toDate().toLocaleString() : ''}</div>
        <hr/>
        <ul>
         ${order.items.map(i=>`
 	 <li>
 	   ${escapeHtml(i.name)} x${i.qty} — ${formatMoney(i.price)} VNĐ
 	   ${i.note ? `<div><b>GHI CHÚ:</b> ${escapeHtml(i.note)}</div>` : ""}
	  </li>
	`).join('')}

        </ul>
        <hr/>
        <div><b>Tổng: ${formatMoney(order.total)} VNĐ</b></div>
      </body></html>
    `;
    const w = window.open('', '_blank');
    w.document.write(html);
    w.document.close();
    w.print();
  }

  // ======= util =======
  function formatMoney(n){ return new Intl.NumberFormat('en-US').format(n); }
  function escapeHtml(s){
    if(!s && s !== 0) return '';
    return String(s).replace(/[&<>"']/g, (m)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

];


 async function initTablesToFirestore(){
  const snap = await tablesRef.get();
  if(!snap.empty) return;

  for(const t of tables){
    await tablesRef.doc(String(t.id)).set({
      name: t.name,
      type: t.type,
      status: "empty",
      cart: [],
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }
  console.log("Đã init tables lên Firestore");
  }




const tablesGrid = document.getElementById("tablesGrid");

function renderTables(){
      if (window.DEBUG) {
      console.log("TABLES ARRAY:", tables);
      }


  tablesGrid.innerHTML="";
  tables.forEach(t=>{
    const div=document.createElement("div");
    div.className="table";
    div.style.left=t.x+"px";
    div.style.top=t.y+"px";

    if(t.type==="staff") div.classList.add("staff");
    else div.classList.add(t.status==="empty" ? "empty" : "busy");

    if(currentTable && currentTable.id === t.id){
      div.classList.add("active");
    }

    div.textContent=t.name;

    div.onclick = () => {

  // 👉 NẾU LÀ BÀN MANG VỀ
  if (t.type === "takeaway") {
    document.getElementById("tableScreen").classList.add("hidden");
    document.getElementById("takeawayScreen").classList.remove("hidden");
    loadTakeaways();
    return;
  }

  // 👉 BÀN BÌNH THƯỜNG
  currentTable = t;

  document.getElementById("tableScreen").classList.add("hidden");
  document.getElementById("orderScreen").classList.remove("hidden");

  renderTables();
  renderCart();
};




    tablesGrid.appendChild(div);
  });
}

async function loadHistoryDays(){
  const daysList = document.getElementById("daysList");
  daysList.innerHTML = "Đang tải...";

  const snap = await db.collection("stores")
    .doc(storeId)
    .collection("daily")
    .orderBy("date","desc")
    .limit(7)
    .get();

  daysList.innerHTML = "";

  snap.forEach(doc=>{
    const d = doc.data();
    const btn = document.createElement("button");
    btn.style.margin = "4px";
    btn.textContent = d.date + " – " + formatMoney(d.totalRevenue) + " VNĐ";
    btn.onclick = ()=> loadDayDetail(d.date);
    daysList.appendChild(btn);
  });
}

async function loadDayDetail(dateKey){
  const detail = document.getElementById("dayDetail");
  detail.innerHTML = "Đang tải chi tiết...";

  const start = new Date(dateKey + "T00:00:00");
  const end = new Date(dateKey + "T23:59:59");

  const ordersSnap = await ordersRef
    .where("createdAt", ">=", start)
    .where("createdAt", "<=", end)
    .get();

  let totalDay = 0;
  let totalCash = 0;
  let totalTransfer = 0;
  let productSummary = {};
  let html = `<h4>Ngày ${dateKey}</h4>`;

  ordersSnap.forEach(doc=>{
    const o = doc.data();
    totalDay += o.total;

    if(o.paymentMethod === "cash"){
      totalCash += o.total;
    }else if(o.paymentMethod === "momo"){
      totalTransfer += o.total;
    }

    o.items.forEach(i=>{
      if(!productSummary[i.name]) productSummary[i.name]=0;
      productSummary[i.name]+=i.qty;
    });

    html += `
      <div class="panel">
        <b>Bàn:</b> ${o.tableName || o.tableId} – ${formatMoney(o.total)} VNĐ
        <div class="small">Thanh toán: ${
          o.paymentMethod === "cash" ? "Tiền mặt" : "Chuyển khoản"
        }</div>
      </div>
    `;
  });

  html += `<hr/><h4>Tổng hợp món</h4><ul>`;
  for(let k in productSummary){
    html += `<li>${k}: ${productSummary[k]} phần</li>`;
  }
  html += `</ul>`;

  html += `
    <div style="margin-top:10px">
      <b>Tổng doanh thu:</b> ${formatMoney(totalDay)} VNĐ
    </div>
    <div class="small" style="margin-top:4px">
      🧾 Tiền mặt: <b style="color:#16a34a">${formatMoney(totalCash)} VNĐ</b>
    </div>
    <div class="small">
      💳 Chuyển khoản: <b style="color:#2563eb">${formatMoney(totalTransfer)} VNĐ</b>
    </div>
  `;

  detail.innerHTML = html;
}

function changeTable() {
  currentTable = null; // bỏ chọn bàn hiện tại

  // Ẩn giao diện order
  document.getElementById("orderScreen").classList.add("hidden");

  // Hiện lại giao diện chọn bàn
  document.getElementById("tableScreen").classList.remove("hidden");

  // Reset lại hiển thị bàn
  document.getElementById("tableNumberDisplay").innerText = "Bàn: --";
}

function listenTakeaways(){
  takeawaysRef
    .orderBy("index")
    .onSnapshot(snap => {

      // chỉ update khi đang ở màn hình mang về
      if (takeawayScreen.classList.contains("hidden")) return;

      loadTakeaways();
    });
}



window.onload = async () => {
  await initTablesToFirestore();
  listenTables();
  listenTakeaways();
};

let noteTimeout = null;

async function autoSaveNote(productId, value){
  if(!currentTable) return;

  // ép chữ hoa
  const note = value.toUpperCase();

  let cart = currentTable.cart || [];
  const idx = cart.findIndex(i => i.id === productId);
  if(idx < 0) return;

  cart[idx].note = note;

  // chống spam Firestore: chỉ lưu sau 3s ngừng gõ
  clearTimeout(noteTimeout);
  noteTimeout = setTimeout(async () => {
    await tablesRef.doc(String(currentTable.id)).set({
      cart: cart,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    console.log("Đã auto-save ghi chú:", cart[idx].name, note);
  }, 3000);
}

const takeawayScreen = document.getElementById("takeawayScreen");
const takeawayList = document.getElementById("takeawayList");
const btnAddTakeaway = document.getElementById("btnAddTakeaway");
const btnBackFromTakeaway = document.getElementById("btnBackFromTakeaway");

btnBackFromTakeaway.onclick = () => {
  takeawayScreen.classList.add("hidden");
  document.getElementById("tableScreen").classList.remove("hidden");
};

btnAddTakeaway.onclick = async () => {
  const snap = await takeawaysRef.orderBy("index", "desc").limit(1).get();
  const nextIndex = snap.empty ? 1 : snap.docs[0].data().index + 1;

  await takeawaysRef.add({
    name: "Mang về " + nextIndex,
    index: nextIndex,
    cart: [],
    status: "busy",
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  loadTakeaways();
};


async function loadTakeaways() {
  takeawayList.innerHTML = "Đang tải...";

  const snap = await takeawaysRef.orderBy("index").get();
  takeawayList.innerHTML = "";

  if (snap.empty) {
    takeawayList.innerHTML = "<div class='small'>Chưa có đơn mang về</div>";
    return;
  }

  snap.forEach(doc => {
    const t = { id: doc.id, ...doc.data() };

    const btn = document.createElement("button");
    btn.style.margin = "4px";
    btn.style.width = "100%";
    btn.style.textAlign = "left";

    btn.innerHTML = `
      🥡 <b>${t.name}</b>
      <span class="small"> – ${t.cart.length} món</span>
    `;

    btn.onclick = () => {
      currentTable = {
        id: t.id,
        name: t.name,
        cart: t.cart || [],
        type: "takeaway",
        ref: takeawaysRef.doc(t.id)
      };

      takeawayScreen.classList.add("hidden");
      document.getElementById("orderScreen").classList.remove("hidden");
      renderCart();
    };

    takeawayList.appendChild(btn);
  });
}
